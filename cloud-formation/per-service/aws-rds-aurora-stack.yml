AWSTemplateFormatVersion: "2010-09-09"
Description: "Per-service - Aurora PostgreSQL cluster, subnet group, security group and DB secret"

# =============================================================================
# per-service/aws-rds-aurora-stack.yml
#
# Creates:
#   - Secrets Manager secret     (auto-generated username/password - "appuser")
#   - DB Subnet Group            (private subnets A/B, imported from VPC stack)
#   - RDS security group         (inbound :5432 from the ECS security group only)
#   - Aurora PostgreSQL Cluster  (Serverless v2 - scales ACUs between Min/MaxCapacity)
#   - Aurora Writer Instance     (db.serverless)
#
# Depends on exports from:
#   - aws-vpc-stack.yml (vpc-id, private-subnet-a/b, sg-ecs-id)
#
# Exports:
#   - ${Environment}-${ProductName}-${AppServiceName}-db-endpoint
#   - ${Environment}-${ProductName}-${AppServiceName}-db-port
#   - ${Environment}-${ProductName}-${AppServiceName}-db-name
#   - ${Environment}-${ProductName}-${AppServiceName}-db-secret-arn
#
# The master password is never stored in plaintext in this template - it is
# generated by Secrets Manager and the cluster resolves it via a dynamic
# reference ({{resolve:secretsmanager:...}}). aws-ecs-service-stack.yml's task
# definition resolves this same secret into DB_USERNAME/DB_PASSWORD via its
# "Secrets" (valueFrom) entries, using the ECS task EXECUTION role granted
# secretsmanager:GetSecretValue in aws-iam-stack.yml - no application code
# ever touches Secrets Manager directly.
#
# EnableHttpEndpoint: true turns on the RDS Data API, which the AWS Console's
# RDS Query Editor requires (it queries over HTTPS, not a direct :5432
# connection). In the Query Editor, connect via "Connect with a Secrets
# Manager ARN" and pick the ${Environment}-${ProductName}-${AppServiceName}-db-secret
# secret - no manual username/password typing needed, and it works even
# though the cluster has no public access.
#
# Deploy:
#   aws cloudformation deploy \
#     --template-file cloud-formation/per-service/aws-rds-aurora-stack.yml \
#     --stack-name <env>-<product>-<component>-rds \
#     --parameter-overrides \
#         ProductName=webstore \
#         Environment=dev \
#         AppServiceName=api-java \
#         DbName=webstore \
#     --region us-east-1
# =============================================================================

Parameters:

  ProductName:
    Type: String
    Description: "Application name - must match the prefix used in the VPC stack exports."

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: "Deployment environment."

  AppServiceName:
    Type: String
    Description: >
      AppServiceName is the name of the application component (e.g., catalog, orders, payments)
      which represents a single containerized microservice.

  DbName:
    Type: String
    Default: appdb
    Description: "Initial database name created inside the Aurora cluster."

  ServerlessMinCapacity:
    Type: Number
    Default: 0.5
    Description: "Minimum Aurora Capacity Units (ACUs) for Serverless v2 scaling. 0.5 is the minimum allowed."

  ServerlessMaxCapacity:
    Type: Number
    Default: 2
    Description: "Maximum Aurora Capacity Units (ACUs) for Serverless v2 scaling. Raise this in prod for higher load."

  AuroraEngineVersion:
    Type: String
    Default: "15.19"
    Description: >
      Aurora PostgreSQL engine version. Verify it is still current for your account/region
      before deploying: aws rds describe-db-engine-versions --engine aurora-postgresql
      --query "DBEngineVersions[].EngineVersion" --output table

  BackupRetentionDays:
    Type: Number
    Default: 7
    Description: "Automated backup retention period in days. Use 14+ in prod."

  DeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "Prevents accidental cluster deletion. Set to true in prod."

Resources:

  # ── DB Secret ─────────────────────────────────────────────────────────────
  # Auto-generated master credentials. Never referenced as a plaintext
  # parameter or environment variable - only via secretsmanager dynamic
  # reference (cluster) or DB_SECRET_ARN (application, at runtime).
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Environment}-${ProductName}-${AppServiceName}-db-secret"
      Description: !Sub "Aurora master credentials for ${Environment}-${ProductName}-${AppServiceName}"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "appuser"}'
        GenerateStringKey: "password"
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: ProductName
          Value: !Ref ProductName
        - Key: Environment
          Value: !Ref Environment
        - Key: AppServiceName
          Value: !Ref AppServiceName
        - Key: Layer
          Value: data
        - Key: ManagedBy
          Value: cloudformation

  # ── DB Subnet Group ───────────────────────────────────────────────────────
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub "${Environment}-${ProductName}-${AppServiceName}-subnet-group"
      DBSubnetGroupDescription: !Sub "Private subnets for ${Environment}-${ProductName}-${AppServiceName} Aurora cluster"
      SubnetIds:
        - Fn::ImportValue: !Sub "${Environment}-${ProductName}-private-subnet-a"
        - Fn::ImportValue: !Sub "${Environment}-${ProductName}-private-subnet-b"
      Tags:
        - Key: ProductName
          Value: !Ref ProductName
        - Key: Environment
          Value: !Ref Environment
        - Key: AppServiceName
          Value: !Ref AppServiceName
        - Key: ManagedBy
          Value: cloudformation

  # ── RDS Security Group ────────────────────────────────────────────────────
  # Inbound :5432 from the shared ECS security group only - never public.
  SgRds:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${Environment}-${ProductName}-${AppServiceName}-sg-rds"
      GroupDescription: "Aurora PostgreSQL - inbound from ECS tasks only"
      VpcId:
        Fn::ImportValue: !Sub "${Environment}-${ProductName}-vpc-id"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub "${Environment}-${ProductName}-sg-ecs-id"
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${ProductName}-${AppServiceName}-sg-rds"
        - Key: ProductName
          Value: !Ref ProductName
        - Key: Environment
          Value: !Ref Environment
        - Key: AppServiceName
          Value: !Ref AppServiceName
        - Key: ManagedBy
          Value: cloudformation

  # ── Aurora PostgreSQL Cluster ─────────────────────────────────────────────
  # UpdateReplacePolicy/DeletionPolicy: Snapshot - a final snapshot is always
  # taken before the cluster is deleted or replaced, regardless of DeletionProtection.
  AuroraCluster:
    Type: AWS::RDS::DBCluster
    UpdateReplacePolicy: Snapshot
    DeletionPolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub "${Environment}-${ProductName}-${AppServiceName}-cluster"
      Engine: aurora-postgresql
      EngineVersion: !Ref AuroraEngineVersion
      DatabaseName: !Ref DbName
      MasterUsername: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds:
        - !Ref SgRds
      StorageEncrypted: true
      BackupRetentionPeriod: !Ref BackupRetentionDays
      DeletionProtection: !Ref DeletionProtection
      EnableHttpEndpoint: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref ServerlessMinCapacity
        MaxCapacity: !Ref ServerlessMaxCapacity
      Tags:
        - Key: ProductName
          Value: !Ref ProductName
        - Key: Environment
          Value: !Ref Environment
        - Key: AppServiceName
          Value: !Ref AppServiceName
        - Key: Layer
          Value: data
        - Key: ManagedBy
          Value: cloudformation

  # ── Aurora Writer Instance (Serverless v2) ────────────────────────────────
  # DBInstanceClass: db.serverless - actual capacity is governed by the
  # cluster's ServerlessV2ScalingConfiguration (Min/MaxCapacity), not this class.
  AuroraWriterInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${Environment}-${ProductName}-${AppServiceName}-instance-1"
      DBClusterIdentifier: !Ref AuroraCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PromotionTier: 0
      PubliclyAccessible: false
      Tags:
        - Key: ProductName
          Value: !Ref ProductName
        - Key: Environment
          Value: !Ref Environment
        - Key: AppServiceName
          Value: !Ref AppServiceName
        - Key: ManagedBy
          Value: cloudformation

# =============================================================================
# Outputs
# =============================================================================

Outputs:

  DbEndpoint:
    Description: "Aurora cluster writer endpoint hostname"
    Value: !GetAtt AuroraCluster.Endpoint.Address
    Export:
      Name: !Sub "${Environment}-${ProductName}-${AppServiceName}-db-endpoint"

  DbPort:
    Description: "Aurora cluster port"
    Value: !GetAtt AuroraCluster.Endpoint.Port
    Export:
      Name: !Sub "${Environment}-${ProductName}-${AppServiceName}-db-port"

  DbName:
    Description: "Initial database name"
    Value: !Ref DbName
    Export:
      Name: !Sub "${Environment}-${ProductName}-${AppServiceName}-db-name"

  DbSecretArn:
    Description: "Secrets Manager ARN holding the Aurora master credentials"
    Value: !Ref DbSecret
    Export:
      Name: !Sub "${Environment}-${ProductName}-${AppServiceName}-db-secret-arn"
