AWSTemplateFormatVersion: "2010-09-09"
Description: "Generic - ECS service for one AppComponent microservice (deployed per component)"

# =============================================================================
# generic/aws-ecs-service-stack.yml
#
# Creates per-component infrastructure for ONE microservice, deployed once per
# AppServiceName per environment.  Multiple deployments of this stack share
# the same ECS cluster and ALB created by aws-ecs-infra-stack.yml.
#
# Creates:
#   - CloudWatch Log Group
#   - ECS Task Definition  (Fargate, awsvpc, single container)
#   - ALB Target Group
#   - ALB Listener Rule    (path-based: /<AppServiceName>/*)
#   - ECS Service
#
# Depends on exports from:
#   - aws-vpc-stack.yml       (VPC, subnets, security groups)
#   - aws-iam-stack.yml       (task execution role, task role - per component)
#   - aws-ecs-infra-stack.yml (ECS cluster, ALB listener ARN)
#   - aws-codebuild-stack.yml (ECR repository URI)
#   - aws-rds-aurora-stack.yml (db endpoint/port/name, db secret ARN)
#
# The container runs the Spring profile matching Environment (dev/staging/prod)
# and connects to the Aurora cluster from aws-rds-aurora-stack.yml - each of
# those profile's application-<env>.yml files reads DB_HOST/DB_PORT/DB_NAME/
# DB_USERNAME/DB_PASSWORD. DB_HOST/DB_PORT/DB_NAME are passed as plain
# environment variables; DB_USERNAME/DB_PASSWORD are resolved directly by the
# ECS agent from the DB secret via the container definition's "Secrets"
# (valueFrom) entries - no plaintext credentials in this template and no
# application code needed to read Secrets Manager.
#
# Exports:
#   - ${Environment}-${ProductName}-${AppServiceName}-ecs-service-name
#
# The image tag is read from an SSM Parameter at deploy time so the pipeline
# only needs to update the parameter - not redeploy the stack - for rolling
# updates.  Bootstrap the parameter once before the first deploy:
#   aws ssm put-parameter \
#     --name /${Environment}-${ProductName}-${AppServiceName}-imageTag \
#     --value latest --type String --region <region>
#
# Deploy:
#   aws cloudformation deploy \
#     --template-file cloudFormation/generic/app-service-stack.yml \
#     --stack-name <env>-<product>-<component>-service \
#     --parameter-overrides \
#         ProductName=my-product \
#         AwsAccountId=123456789012 \
#         Environment=prod \
#         AppServiceName=catalog \
#         ContainerPort=8080 \
#         HealthCheckPath=/actuator/health \
#         ListenerRulePriority=10 \
#     --region us-east-1
# =============================================================================

Parameters:

  ProductName:
    Type: String
    Description: "Application name - must match the prefix used in app-shared-stack, app-vpc-stack, and app-iam-stack exports."

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: "Deployment environment."

  AppServiceName:
    Type: String
    Description: >
      Name of the application component (e.g., catalog, orders, payments).
      Represents a single containerized microservice. Used to namespace all
      resources and to build the ALB path-based routing rule (/<AppServiceName>/*).

  ContainerPort:
    Type: Number
    Default: 8080
    Description: "Port the container listens on."

  HealthCheckPath:
    Type: String
    Default: /actuator/health
    Description: >
      ALB target group health-check path, relative to the service's own
      context path (NOT the full path — do not include /<AppServiceName>
      here). CloudFormation parameters cannot reference another parameter in
      their Default, so this stays just the suffix; the TargetGroup resource
      below builds the actual path as /<AppServiceName><HealthCheckPath> via
      !Sub. The application must run with
      server.servlet.context-path=/<AppServiceName> to match the ALB's
      path-based routing rule (/<AppServiceName>/*).

  HealthCheckIntervalSeconds:
    Type: Number
    Default: 30
    Description: "Seconds between ALB health checks."

  HealthCheckTimeoutSeconds:
    Type: Number
    Default: 5
    Description: "Seconds before an ALB health check times out."

  HealthyThresholdCount:
    Type: Number
    Default: 2
    Description: "Consecutive successful checks before a target is considered healthy."

  UnhealthyThresholdCount:
    Type: Number
    Default: 3
    Description: "Consecutive failed checks before a target is considered unhealthy."

  ListenerRulePriority:
    Type: Number
    Description: >
      Priority for the ALB Listener Rule (1–50000, must be unique across all
      services attached to the same listener).

  TaskCpu:
    Type: Number
    Default: 512
    AllowedValues: [256, 512, 1024, 2048, 4096]
    Description: "Fargate task CPU units."

  TaskMemory:
    Type: Number
    Default: 1024
    Description: "Fargate task memory (MiB). Must be a valid combination for the chosen TaskCpu."

  DesiredCount:
    Type: Number
    Default: 0
    Description: "Number of ECS task replicas to run. Defaults to 0 so no tasks are launched during cloudformation deploy. The CI/CD pipeline scales this up via aws ecs update-service --desired-count N --force-new-deployment."

  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
    Description: "CloudWatch Log Group retention period in days."

Resources:

  # ── CloudWatch Log Group ─────────────────────────────────────────────────────
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${Environment}-${ProductName}-${AppServiceName}"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: ProductName
          Value: !Ref ProductName
        - Key: Environment
          Value: !Ref Environment
        - Key: AppServiceName
          Value: !Ref AppServiceName
        - Key: Layer
          Value: build
        - Key: ManagedBy
          Value: cloudformation

  # ── Task Definition ──────────────────────────────────────────────────────────
  # UpdateReplacePolicy: Retain - when CloudFormation replaces this resource
  # (which happens on every image/cpu/memory change because ECS task definitions
  # are immutable), the old revision is kept ACTIVE in ECS instead of being
  # deregistered. This allows rollback via ecs:UpdateService --task-definition.
  # DeletionPolicy: Retain - prevents deregistration when the stack is deleted.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      Family: !Sub "${Environment}-${ProductName}-${AppServiceName}-task"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${Environment}-${ProductName}-${AppServiceName}-ecs-task-execution-role-arn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${Environment}-${ProductName}-${AppServiceName}-ecs-task-role-arn"
      ContainerDefinitions:
        - Name: !Sub "${Environment}-${ProductName}-${AppServiceName}-container"
          Image: !Sub
            - "${EcrRepoUri}:{{resolve:ssm:/${Environment}-${ProductName}-${AppServiceName}-imageTag}}"
            - EcrRepoUri:
                Fn::ImportValue: !Sub "${Environment}-${ProductName}-${AppServiceName}-ecr-repository-uri"
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: !Ref Environment
            - Name: SERVER_PORT
              Value: !Sub "${ContainerPort}"
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub "${Environment}-${ProductName}-${AppServiceName}-db-endpoint"
            - Name: DB_PORT
              Value:
                Fn::ImportValue: !Sub "${Environment}-${ProductName}-${AppServiceName}-db-port"
            - Name: DB_NAME
              Value:
                Fn::ImportValue: !Sub "${Environment}-${ProductName}-${AppServiceName}-db-name"
          # Resolved by the ECS agent at task startup using the task EXECUTION
          # role (see aws-iam-stack.yml) - never passed as plaintext and never
          # touched by application code.
          Secrets:
            - Name: DB_USERNAME
              ValueFrom: !Sub
                - "${SecretArn}:username::"
                - SecretArn:
                    Fn::ImportValue: !Sub "${Environment}-${ProductName}-${AppServiceName}-db-secret-arn"
            - Name: DB_PASSWORD
              ValueFrom: !Sub
                - "${SecretArn}:password::"
                - SecretArn:
                    Fn::ImportValue: !Sub "${Environment}-${ProductName}-${AppServiceName}-db-secret-arn"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/${Environment}-${ProductName}-${AppServiceName}"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
      Tags:
        - Key: AppServiceName
          Value: !Ref AppServiceName
        - Key: ProductName
          Value: !Ref ProductName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  # ── ALB Target Group ──────────────────────────────────────────────────────────
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${Environment}-${ProductName}-${AppServiceName}-tg"
      VpcId:
        Fn::ImportValue: !Sub "${Environment}-${ProductName}-vpc-id"
      Protocol: HTTP
      Port: !Ref ContainerPort
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Sub "/${AppServiceName}${HealthCheckPath}"
      HealthCheckIntervalSeconds: !Ref HealthCheckIntervalSeconds
      HealthCheckTimeoutSeconds: !Ref HealthCheckTimeoutSeconds
      HealthyThresholdCount: !Ref HealthyThresholdCount
      UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
      Tags:
        - Key: AppServiceName
          Value: !Ref AppServiceName
        - Key: ProductName
          Value: !Ref ProductName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  # ── ALB Listener Rule ─────────────────────────────────────────────────────────
  # Routes /<AppServiceName>/* to this service's TargetGroup.
  # Priority must be unique across all services attached to the same listener.
  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn:
        Fn::ImportValue: !Sub "${Environment}-${ProductName}-alb-listener-arn"
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: path-pattern
          Values:
            - !Sub "/${AppServiceName}/*"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ── ECS Service ───────────────────────────────────────────────────────────────
  EcsService:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      ServiceName: !Sub "${Environment}-${ProductName}-${AppServiceName}-service"
      Cluster:
        Fn::ImportValue: !Sub "${Environment}-${ProductName}-ecs-cluster-arn"
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - Fn::ImportValue: !Sub "${Environment}-${ProductName}-private-subnet-a"
            - Fn::ImportValue: !Sub "${Environment}-${ProductName}-private-subnet-b"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${Environment}-${ProductName}-sg-ecs-id"
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: !Sub "${Environment}-${ProductName}-${AppServiceName}-container"
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - Key: AppServiceName
          Value: !Ref AppServiceName
        - Key: ProductName
          Value: !Ref ProductName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

# =============================================================================
# Outputs
# =============================================================================

Outputs:

  EcsServiceName:
    Description: "ECS Service name"
    Value: !GetAtt EcsService.Name
    Export:
      Name: !Sub "${Environment}-${ProductName}-${AppServiceName}-ecs-service-name"
